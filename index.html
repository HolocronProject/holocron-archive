<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Holocron Archive</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #05070d;
      color: white;
      text-align: center;
    }

    header {
      padding: 80px 20px 50px;
    }

    h1 {
      margin: 0;
      font-size: 48px;
      letter-spacing: 4px;
    }

    .subtitle {
      margin-top: 20px;
      color: #b8c7e0;
      font-size: 18px;
    }

    .menu {
      max-width: 900px;
      margin: 20px auto 80px;
      padding: 0 20px;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
    }

    .menu a {
      display: block;
      padding: 22px;
      border: 1px solid #5ba9ff;
      border-radius: 10px;
      color: white;
      text-decoration: none;
      background-color: #0d1422;
    }

    .menu a:hover {
      background-color: #16253d;
    }

    footer {
      padding: 30px;
      color: #7f8da3;
      font-size: 14px;
    }

    @media (max-width: 600px) {
      h1 {
        font-size: 34px;
      }

      .menu {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <header>
    <h1>HOLOCRON ARCHIVE</h1>
    <p class="subtitle">
      スター・ウォーズをデータで楽しむ個人ファンサイト
    </p>
  </header>

  <main class="menu">
    <a href="#">📖 完全時系列</a>
    <a href="#">👤 キャラクター</a>
    <a href="#">🪐 惑星</a>
    <a href="#">🧬 種族</a>
    <a href="#">⚔️ ライトセーバー</a>
    <a href="#">🚀 宇宙船</a>
    <a href="#">💬 名言</a>
    <a href="#">📝 ブログ</a>
  </main>

  <footer>
    This is an unofficial Star Wars fan site.
  </footer>
</body>
</html>
